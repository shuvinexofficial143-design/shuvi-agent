[package]
name = "shuvi"
default-run = "shuvi"
version = "0.1.3"
description = "Shuvi permission-first AI computer agent"
authors = ["Shuvi"]
edition = "2021"

# Compile the fixed worker explicitly for sidecar staging/tests. Tauri must
# otherwise bundle it exactly once via externalBin, never as a second Cargo
# non-main binary with the same installed executable filename.
[features]
sha-worker-build = []

[[bin]]
name = "shuvi-readonly-hash-worker"
path = "src/bin/shuvi-readonly-hash-worker.rs"
required-features = ["sha-worker-build"]

[lib]
name = "shuvi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
keyring = { version = "3", features = ["windows-native"] }
sysinfo = "0.33"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }
