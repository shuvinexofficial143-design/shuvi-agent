[package]
name = "shuvi"
version = "0.1.3"
description = "Shuvi permission-first AI computer agent"
authors = ["Shuvi"]
edition = "2021"

[lib]
name = "shuvi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
keyring = { version = "3", features = ["windows-native"] }
sysinfo = "0.33"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
# Reuse the version already locked by the Tauri dependency graph.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
