name: After Effects Source CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  ae-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Repository structural validation
        run: npm run validate
      - name: After Effects source safety tests
        run: node --test scripts/after-effects-source-safety.test.mjs scripts/after-effects-source-completion.test.mjs scripts/after-effects-behavior.test.mjs

  ae-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: After Effects Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib after_effects
