name: Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify exact release commit
        run: npm run verify:full

      - name: Upload full verification attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-attestation
          path: .shuvi-attest/full-*.json
          if-no-files-found: error

      - name: Build NSIS installer
        run: npx tauri build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: shuvi-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
