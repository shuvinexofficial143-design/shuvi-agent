name: Web Dashboard CI

on:
  push:
    branches:
      - ui-dashboard
    paths:
      - "web-dashboard/**"
      - "package.json"
      - "index.html"
      - "src/entry.ts"
      - "src-tauri/tauri.conf.json"
      - "vite.config.ts"
      - ".github/workflows/web-dashboard-ci.yml"
  pull_request:
    paths:
      - "web-dashboard/**"
      - "package.json"
      - "index.html"
      - "src/entry.ts"
      - "src-tauri/tauri.conf.json"
      - "vite.config.ts"
      - ".github/workflows/web-dashboard-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web-dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Test UI contracts
        run: npm test

      - name: Build dashboard
        run: npm run build

      # The legacy Desktop UI remains required by Windows/Tauri. Validate that
      # browser route hardening does not break the native frontend bundle.
      - name: Install native frontend dependencies
        working-directory: .
        run: npm ci

      - name: Verify preserved Tauri frontend build
        working-directory: .
        run: npm run build
