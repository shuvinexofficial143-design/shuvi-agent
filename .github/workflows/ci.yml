name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Frontend verification with attestation
        run: npm run verify:frontend
      - name: Upload frontend attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-attestation
          path: .shuvi-attest/frontend-*.json
          if-no-files-found: warn
          include-hidden-files: true

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust verification with attestation
        run: npm run verify:rust
      - name: Upload Rust attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-attestation
          path: .shuvi-attest/rust-*.json
          if-no-files-found: warn
          include-hidden-files: true
