name: Substance 3D Source CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  substance-3d-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Repository structural validation
        run: npm run validate
      - name: Substance 3D source safety tests
        run: node --test scripts/substance-3d-source-safety.test.mjs

  substance-3d-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Substance 3D Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib substance_3d
