name: Shuvi Desktop Dashboard Preview

# Preview installers are manual-only until native Windows UI acceptance is complete.
# Pushes run source CI but must not produce an installer ZIP automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact development commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked dependencies
        run: npm ci

      - name: Verify frontend source, UI contracts and safety tests
        # The existing attestation wrapper uses spawnSync('npm.cmd') which is
        # incompatible with Node 22+ on current Windows runners (EINVAL).
        # Run the same checks directly; Linux CI still produces attestation.
        shell: pwsh
        run: |
          npm run validate
          if ($LASTEXITCODE -ne 0) { throw 'Validation failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Node safety tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
          node scripts/verify-packaged-dashboard.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Premium Dashboard is not the packaged Windows entrypoint' }

      - name: Compile unsigned Windows Tauri NSIS preview
        # Existing repository has Tauri Rust 2.12 vs JS API 2.11.
        # Preview-only workaround; align lockfiles before a production release.
        run: npx tauri build --ci --bundles nsis --ignore-version-mismatches

      - name: Record installer SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (!$exe) { throw 'Windows preview installer missing' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "Installer: $($exe.Name)" | Out-File -Encoding utf8 installer-sha256.txt
          "SHA256: $hash" | Add-Content -Encoding utf8 installer-sha256.txt
          "Commit: $env:GITHUB_SHA" | Add-Content -Encoding utf8 installer-sha256.txt

      - name: Upload unsigned Windows preview and verification digest
        uses: actions/upload-artifact@v4
        with:
          name: shuvi-desktop-dashboard-preview
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            installer-sha256.txt
          if-no-files-found: error
