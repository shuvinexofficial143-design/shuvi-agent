name: Shuvi Microsoft Store MSIX (Submission Only)

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: Exact Partner Center Package Identity Name
        required: true
        type: string
      publisher:
        description: Exact Partner Center Publisher CN
        required: true
        type: string
      publisher_display_name:
        description: Exact Partner Center publisher display name
        required: true
        type: string

permissions:
  contents: read

jobs:
  package-store:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Verify Shuvi source and premium UI
        shell: pwsh
        run: |
          npm run validate
          if ($LASTEXITCODE -ne 0) { throw 'Validation failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Safety tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
          node scripts/verify-packaged-dashboard.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Premium UI verification failed' }
      - name: Compile Shuvi executable without unsigned installer
        run: npx tauri build --ci --no-bundle --ignore-version-mismatches
      - name: Build unsigned MSIX for Store submission only
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ inputs.identity_name }}
          STORE_PUBLISHER: ${{ inputs.publisher }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
        run: |
          ./scripts/build-store-msix.ps1 -IdentityName $env:STORE_IDENTITY_NAME -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME
      - uses: actions/upload-artifact@v4
        with:
          name: shuvi-MSIX-FOR-MICROSOFT-STORE-SUBMISSION-ONLY
          path: |
            dist-store/*.msix
            dist-store/msix-sha256.json
          if-no-files-found: error
          retention-days: 7
