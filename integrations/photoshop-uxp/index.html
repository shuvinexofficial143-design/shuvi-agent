<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shuvi Photoshop Bridge</title>
  <style>
    body{font-family:Arial,sans-serif;margin:16px;background:#202020;color:#f2f2f2}
    label{display:block;margin:10px 0 6px}
    input{width:100%;box-sizing:border-box;padding:8px;background:#2d2d2d;color:#fff;border:1px solid #555}
    button{margin-top:10px;padding:8px 12px}
    #status{margin-top:12px;white-space:pre-wrap;font-size:12px}
  </style>
</head>
<body>
  <h3>Shuvi Photoshop Bridge</h3>
  <p>40% milestone: read-only document/layer inspection only.</p>
  <label for="token">Pairing token</label>
  <input id="token" type="password" autocomplete="off">
  <button id="connect">Connect</button>
  <button id="disconnect">Disconnect</button>
  <div id="status">Disconnected.</div>
  <script src="index.js"></script>
</body>
</html>
