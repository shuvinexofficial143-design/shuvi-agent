<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Shuvi Premiere Bridge</title>
    <style>
      body {
        box-sizing: border-box;
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
        color: var(--uxp-host-text-color-secondary, #f3f3f3);
        background: var(--uxp-host-background-color, #202020);
      }
      h1 { margin: 0 0 6px; font-size: 18px; }
      p { line-height: 1.45; opacity: .8; }
      label { display: grid; gap: 6px; margin-top: 14px; font-size: 12px; }
      input {
        min-height: 30px;
        padding: 0 8px;
        border: 1px solid #5a5a5a;
        border-radius: 4px;
        background: #171717;
        color: #f4f4f4;
      }
      input:focus {
        border-color: #8b8b8b;
        outline: none;
      }
      button {
        width: 100%;
        margin: 8px 0 0;
        min-height: 34px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      #bridgeStatus {
        margin: 10px 0 0;
        font-size: 12px;
        opacity: .75;
      }
      #bridgeStatus.connected {
        opacity: 1;
        font-weight: 600;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 10px;
        border: 1px solid #555;
        border-radius: 6px;
        min-height: 130px;
        max-height: 260px;
        overflow: auto;
      }
      .muted { font-size: 12px; opacity: .65; }
    </style>
  </head>
  <body>
    <h1>Shuvi Premiere Bridge</h1>
    <p>Native Premiere control for the Shuvi desktop agent.</p>

    <label>
      Pairing token from Shuvi
      <input id="tokenInput" type="password" placeholder="Paste temporary pairing token" />
    </label>

    <div class="row">
      <button id="connect">Connect</button>
      <button id="disconnect">Disconnect</button>
    </div>

    <div id="bridgeStatus">Disconnected</div>

    <button id="inspect">Inspect active project / sequence</button>
    <pre id="output">Bridge loaded. Pair it with Shuvi to accept typed Premiere commands.</pre>

    <p class="muted">The bridge only accepts commands from localhost and requires Shuvi's temporary pairing token.</p>
    <script src="main.js"></script>
  </body>
</html>
